<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CPC 28 | Professor Moreira</title><style>
:root{--bg:#10133c;--yellow:#ffe34b;--pink:#ff3b86;--cyan:#1de5ef;--green:#4af5a4;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(circle at 10% 0%,#4d238f 0,transparent 45%),radial-gradient(circle at 100% 85%,#0b6884 0,transparent 45%),var(--bg);color:white;min-height:100dvh}.app{max-width:850px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px 14px max(12px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900;color:var(--yellow);font-size:clamp(14px,3.5vw,20px)}.progress{height:9px;border-radius:30px;background:#ffffff30;margin:10px 0 16px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--green));transition:width .2s}.slide{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;animation:enter .2s ease}@keyframes enter{from{opacity:.3;transform:translateX(10px)}to{opacity:1;transform:none}}.tag{align-self:flex-start;background:var(--yellow);color:#191339;padding:8px 15px;border-radius:100px;font-size:clamp(14px,3.4vw,18px);font-weight:1000}.title{font-size:clamp(30px,7.5vw,54px);line-height:1.07;margin:4px 0;font-weight:1000;text-shadow:3px 4px 0 #0005}.cards{display:grid;gap:12px}.card{background:#fff;color:#17183b;border-radius:19px;padding:18px 19px;border-left:10px solid var(--cyan);box-shadow:0 7px 0 #0004;font-size:clamp(21px,5.2vw,30px);line-height:1.35;font-weight:750}.card:nth-child(2n){border-left-color:var(--pink)}.card:nth-child(3n){border-left-color:var(--yellow)}.card strong{color:#bd1361}.card .small{font-size:.8em;font-weight:650}.highlight{background:var(--yellow);color:#18143a;border-radius:16px;padding:15px 18px;font-weight:950;font-size:clamp(22px,5.7vw,34px);text-align:center}.subtitle{font-size:clamp(21px,5vw,29px);font-weight:800;color:var(--cyan)}.nav{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;padding:13px 0 4px;background:linear-gradient(transparent,#10133c 16%)}button{border:0;border-radius:15px;min-height:60px;font-weight:1000;font-size:clamp(15px,4vw,22px);cursor:pointer;color:#17183b;box-shadow:0 5px 0 #0006}button:active{transform:translateY(3px)}button:disabled{opacity:.35;cursor:default}#prev{background:var(--cyan)}#next{background:var(--yellow)}#reset{background:var(--pink);color:white}.cover{text-align:center;align-items:center}.cover .title{font-size:clamp(37px,9vw,67px);color:var(--yellow)}.cover .subtitle{color:white}.emoji{font-size:clamp(65px,17vw,120px);line-height:1.1}.pill{background:#ffffff26;border:2px solid #ffffff55;border-radius:18px;padding:14px;font-size:clamp(19px,4.6vw,26px);font-weight:800;text-align:center}.footer{text-align:center;color:#d1d5ff;font-size:13px;margin-top:7px}@media(min-width:650px){.cards.two{grid-template-columns:1fr 1fr}}@media(max-height:620px){.slide{justify-content:flex-start}.card{padding:12px 15px}.title{font-size:30px}.nav button{min-height:48px}}
</style></head><body><main class="app"><div class="top"><span>🎡 CPC 28 • TEORIA</span><span id="counter"></span></div><div class="progress"><div class="bar" id="bar"></div></div><section class="slide" id="slide" aria-live="polite"></section><nav class="nav"><button id="prev">⬅ Voltar</button><button id="reset">⟲ Reiniciar</button><button id="next">Avançar ➜</button></nav><div class="footer">Curso de Contabilidade Professor Moreira</div></main><script>
const slides=[
{cover:1,emoji:'🏢💰🏡',title:'PROPRIEDADE PARA INVESTIMENTO',subtitle:'CURSO DE CONTABILIDADE PROFESSOR MOREIRA',cards:['📘 CPC 28','🎡 Teoria visual • letras grandes • revisão rápida']},
{tag:'CONCEITO',title:'O que é propriedade para investimento?',cards:['🏡 Terreno, edifício, parte de edifício ou ambos.','💵 Mantido para obter <strong>aluguéis</strong>, <strong>valorização do capital</strong> ou ambas as finalidades.','👤 Pode ser mantido pelo proprietário ou pelo arrendatário como ativo de direito de uso.']},
{tag:'ATENÇÃO!',title:'O que NÃO é PPI?',cards:['🏭 Imóvel usado na produção ou no fornecimento de bens e serviços.','🏢 Imóvel utilizado para finalidades administrativas.','🏷️ Imóvel destinado à venda no curso normal dos negócios.'],highlight:'A finalidade do imóvel determina sua classificação.'},
{tag:'BALANÇO PATRIMONIAL',title:'Onde fica a PPI?',cards:['📊 <strong>Ativo Não Circulante</strong>','📁 Subgrupo: <strong>Investimentos</strong>','🏠 A propriedade é mantida para renda e/ou valorização, não para uso operacional.'],highlight:'ANC → INVESTIMENTOS'},
{tag:'EXEMPLO 1',title:'Terreno para valorização',cards:['🌳 Terreno mantido para valorização do capital a longo prazo.','🚫 Não é mantido para venda a curto prazo no curso normal dos negócios.'],highlight:'✅ PROPRIEDADE PARA INVESTIMENTO'},
{tag:'EXEMPLO 2',title:'Uso futuro indeterminado',cards:['❓ A entidade comprou um terreno, mas ainda não decidiu seu uso futuro.','📈 Se não determinou uso próprio nem venda a curto prazo, o terreno é considerado mantido para valorização do capital.'],highlight:'✅ PROPRIEDADE PARA INVESTIMENTO'},
{tag:'EXEMPLO 3',title:'Edifício alugado',cards:['🏬 Edifício de propriedade da entidade arrendado a terceiros em um ou mais arrendamentos operacionais.','💵 Objetivo: obter rendimentos de aluguel.'],highlight:'✅ PROPRIEDADE PARA INVESTIMENTO'},
{tag:'EXEMPLO 4',title:'Edifício vazio',cards:['🏢 O prédio está desocupado.','🔑 Porém, é mantido para ser alugado futuramente sob arrendamento operacional.'],highlight:'✅ PROPRIEDADE PARA INVESTIMENTO'},
{tag:'EXEMPLO 5',title:'Imóvel em construção',cards:['🏗️ Imóvel em construção ou desenvolvimento.','🎯 Finalidade futura: utilização como propriedade para investimento.'],highlight:'✅ PROPRIEDADE PARA INVESTIMENTO'},
{tag:'COMPARAÇÃO',title:'Três finalidades diferentes',cards:['💰 <strong>Investimentos:</strong> imóvel para aluguel e/ou valorização.','🏭 <strong>Imobilizado:</strong> imóvel utilizado nas operações ou na administração.','🏷️ <strong>Estoques:</strong> imóvel destinado à venda no curso ordinário do negócio.']},
{tag:'SERVIÇOS DE APOIO',title:'Serviços insignificantes',cards:['🛡️ O proprietário fornece segurança e manutenção aos ocupantes de um prédio de escritórios.','🔎 Se esses serviços forem <strong>insignificantes</strong> em relação ao acordo como um todo, o imóvel continua sendo PPI.'],highlight:'SERVIÇOS INSIGNIFICANTES → PPI'},
{tag:'SERVIÇOS DE APOIO',title:'Serviços significativos',cards:['🏨 Hotel administrado pelo proprietário.','🛎️ Os serviços prestados aos hóspedes são significativos em relação ao acordo como um todo.','🏢 Nesse caso, trata-se de propriedade ocupada pelo proprietário.'],highlight:'SERVIÇOS SIGNIFICATIVOS → IMOBILIZADO'},
{tag:'MENSURAÇÃO',title:'Depois do reconhecimento inicial',cards:['⚖️ A entidade pode escolher como política contábil o <strong>modelo do valor justo</strong> ou o <strong>modelo do custo</strong>.','📚 Conforme o material, a política deve ser aplicada às propriedades para investimento da entidade.'],highlight:'VALOR JUSTO OU CUSTO'},
{tag:'VALOR JUSTO',title:'PPI mensurada pelo valor justo',cards:['📈 Aumento do valor justo: <strong>ganho no resultado</strong>.','📉 Redução do valor justo: <strong>perda no resultado</strong>.','🧾 As variações posteriores no valor justo afetam a Demonstração do Resultado do Exercício.'],highlight:'GANHO OU PERDA → DRE'},
{tag:'TRANSFERÊNCIA',title:'Estoque que vira PPI',cards:['🏷️ Antes: imóvel classificado em estoque.','🏡 Depois: mantido para aluguel ou valorização.','📈 Valor justo maior que o valor contábil → <strong>receita</strong>.','📉 Valor justo menor que o valor contábil → <strong>despesa</strong>.'],highlight:'ESTOQUE → PPI: DIFERENÇA NO RESULTADO'},
{tag:'EXEMPLO PRÁTICO',title:'Estoque → PPI',cards:['🏷️ Valor contábil do terreno: <strong>R$ 100.000</strong>.','📈 Valor justo na transferência: <strong>R$ 120.000</strong>.','💰 Diferença positiva: <strong>R$ 20.000 de receita</strong>.'],highlight:'120.000 − 100.000 = +20.000'},
{tag:'TRANSFERÊNCIA',title:'Imobilizado que vira PPI',cards:['🏭 Antes: imóvel usado pela empresa.','🏡 Depois: imóvel destinado a aluguel ou valorização, adotando-se o valor justo.','📈 Valor justo maior que o valor contábil → <strong>Ajuste de Avaliação Patrimonial (PL)</strong>, conforme o esquema do material.','📉 Valor justo menor que o valor contábil → <strong>despesa</strong>, conforme o esquema do material.']},
{tag:'EXEMPLO PRÁTICO',title:'Imobilizado → PPI',cards:['🏢 Valor contábil do prédio: <strong>R$ 100.000</strong>.','📈 Valor justo na transferência: <strong>R$ 180.000</strong>.','📊 Diferença positiva: <strong>R$ 80.000 em Ajustes de Avaliação Patrimonial</strong>.'],highlight:'180.000 − 100.000 = +80.000'},
{tag:'TRANSFERÊNCIA',title:'PPI que vira imobilizado',cards:['🏡 Antes: imóvel mantido para aluguel ou valorização.','🏭 Depois: a entidade passa a utilizá-lo em suas próprias operações.','📌 Se a PPI estava mensurada ao valor justo, esse valor na data da mudança de uso passa a ser o custo considerado para a contabilização posterior.']},
{tag:'TRANSFERÊNCIA',title:'PPI que vira estoque',cards:['🏡 Antes: propriedade para investimento.','🏷️ Depois: há mudança de uso com início de desenvolvimento para venda.','📌 Se a PPI estava mensurada ao valor justo, o valor justo na data da mudança de uso é o custo considerado para a contabilização posterior.']},
{tag:'MAPA MENTAL',title:'Memorize as transferências',cards:['🏷️ <strong>Estoque → PPI:</strong> diferença entre valor justo e valor contábil no resultado.','🏭 <strong>Imobilizado → PPI:</strong> aumento, em regra, em AAP; redução, em regra, em despesa, conforme o material.','🏡 <strong>PPI → Imobilizado/Estoque:</strong> valor justo na mudança de uso, quando adotado esse modelo.','📈 <strong>PPI → PPI:</strong> variação posterior do valor justo na DRE.']},
{tag:'REVISÃO FINAL',title:'Macetes para a prova',cards:['💵 <strong>Aluguel e valorização:</strong> PPI.','🏭 <strong>Uso próprio:</strong> imobilizado.','🏷️ <strong>Venda habitual:</strong> estoque.','🏨 <strong>Serviços significativos:</strong> imobilizado.','📊 <strong>Valor justo da PPI:</strong> ganhos e perdas posteriores na DRE.']},
{cover:1,emoji:'🏆🎡',title:'REVISÃO CONCLUÍDA!',subtitle:'PROPRIEDADE PARA INVESTIMENTO • CPC 28',cards:['👏 Parabéns pelos estudos!','📚 Curso de Contabilidade Professor Moreira','🔄 Toque em Reiniciar para revisar novamente.']}
];
let idx=0;const el=document.getElementById('slide');function render(){const s=slides[idx];el.className='slide'+(s.cover?' cover':'');el.innerHTML=(s.tag?`<div class="tag">${s.tag}</div>`:'')+(s.emoji?`<div class="emoji">${s.emoji}</div>`:'')+`<h1 class="title">${s.title}</h1>`+(s.subtitle?`<div class="subtitle">${s.subtitle}</div>`:'')+`<div class="cards">${s.cards.map(c=>`<div class="card">${c}</div>`).join('')}</div>`+(s.highlight?`<div class="highlight">${s.highlight}</div>`:'');document.getElementById('counter').textContent=`${idx+1} / ${slides.length}`;document.getElementById('bar').style.width=((idx+1)/slides.length*100)+'%';document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===slides.length-1;window.scrollTo(0,0)}document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render()}};document.getElementById('next').onclick=()=>{if(idx<slides.length-1){idx++;render()}};document.getElementById('reset').onclick=()=>{idx=0;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&idx<slides.length-1){idx++;render()}if(e.key==='ArrowLeft'&&idx>0){idx--;render()}});render();
</script></body></html>
